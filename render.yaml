# Render Blueprint — paths are relative to REPO ROOT (github.com/Aayushhh07/Foresence)
services:
  - type: web
    name: foresence-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: starter
    healthCheckPath: /api/health
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1
    envVars:
      - key: APP_MODE
        value: prod
      - key: ENABLE_DEMO_ROUTES
        value: "true"
      - key: ENABLE_PREDEFINED_ZONES
        value: "false"
      - key: DB_NAME
        value: foresence
      - key: SCAN_INTERVAL_HOURS
        value: "12"
      - key: NDVI_DROP_THRESHOLD
        value: "0.15"
      - key: CONFIDENCE_THRESHOLD
        value: "0.70"
      - key: MONGODB_URI
        sync: false
      - key: UPSTASH_REDIS_URL
        sync: false
      - key: COPERNICUS_USERNAME
        sync: false
      - key: COPERNICUS_PASSWORD
        sync: false
      - key: CLOUDFLARE_R2_ACCESS_KEY
        sync: false
      - key: CLOUDFLARE_R2_SECRET_KEY
        sync: false
      - key: CLOUDFLARE_R2_BUCKET_NAME
        value: foresence-images
      - key: CLOUDFLARE_R2_ENDPOINT
        sync: false
      - key: CLOUDFLARE_R2_PUBLIC_URL
        sync: false
      - key: SENDGRID_API_KEY
        sync: false
      - key: ALERT_FROM_EMAIL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: FRONTEND_URL
        sync: false
