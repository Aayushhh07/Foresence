services:
  - type: web
    name: foresence-backend
    env: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    buildCommand: ""
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: COPERNICUS_USERNAME
        sync: false
      - key: COPERNICUS_PASSWORD
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: DB_NAME
        value: foresence
      - key: CLOUDFLARE_R2_ACCESS_KEY
        sync: false
      - key: CLOUDFLARE_R2_SECRET_KEY
        sync: false
      - key: CLOUDFLARE_R2_BUCKET_NAME
        value: foresence-images
      - key: CLOUDFLARE_R2_ENDPOINT
        sync: false
      - key: CLOUDFLARE_R2_PUBLIC_URL
        sync: false
      - key: UPSTASH_REDIS_URL
        sync: false
      - key: SENDGRID_API_KEY
        sync: false
      - key: ALERT_FROM_EMAIL
        sync: false
      - key: SCAN_INTERVAL_HOURS
        value: "12"
      - key: NDVI_DROP_THRESHOLD
        value: "0.15"
      - key: CONFIDENCE_THRESHOLD
        value: "0.70"
      - key: CORS_ORIGINS
        sync: false
      - key: FRONTEND_URL
        sync: false
